# Runs the iPhone Duo stock check every 15 minutes (Vercel's free plan only allows a
# daily cron). No secrets needed: /api/run limits itself to one check per 10 min.
name: iPhone Duo check (every 15 min)

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may delay runs a little)
  workflow_dispatch: {}    # "Run workflow" button in the Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Run check on Vercel
        run: |
          curl -sS --max-time 60 "https://iphone-duo-virid.vercel.app/api/run"
          echo
