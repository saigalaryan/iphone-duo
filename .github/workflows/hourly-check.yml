# Pings your Vercel deployment every hour (Vercel's free Hobby plan only allows
# daily crons). Free for any GitHub repo.
#
# Repo → Settings → Secrets and variables → Actions → add:
#   APP_URL      e.g. https://duo-watch-yourname.vercel.app
#   CRON_SECRET  same value as the CRON_SECRET env var on Vercel
name: Hourly iPhone Duo check

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07 UTC
  workflow_dispatch: {}    # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger check
        run: |
          curl -sS --fail-with-body --max-time 60 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/check"
